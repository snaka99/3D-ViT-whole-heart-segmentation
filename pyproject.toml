[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-vit-segmentation"
version = "0.1.0"
description = "Modular MONAI/PyTorch 3D Vision Transformer segmentation for CT and MRI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "monai>=1.3,<2",
  "numpy>=1.24,<2",
  "nibabel>=5.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "pyyaml>=6.0",
  "einops>=0.7",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
medical-vit = "medical_vit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
